app = "pocket-fantasy-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 9911
  protocol = "tcp"

  [[services.ports]]
    port = 9911
